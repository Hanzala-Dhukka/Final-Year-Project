services:
  - type: web
    name: cybershield-backend
    runtime: python
    pythonVersion: "3.12.4"
    region: oregon
    plan: free
    buildCommand: "pip install -r cybershield/backend/requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    workingDir: cybershield/backend
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: BACKEND_URL
        value: "https://final-year-project-id8d.onrender.com"
      - key: FRONTEND_URL
        value: "https://final-year-project-fjgf.vercel.app"
      - key: GOOGLE_REDIRECT_URI
        value: "https://final-year-project-id8d.onrender.com/api/v1/auth/oauth/google/callback"
      - key: GITHUB_REDIRECT_URI
        value: "https://final-year-project-id8d.onrender.com/api/v1/auth/oauth/github/callback"
      # Email (SMTP) — Gmail app password (16 chars, no spaces).
      # Used by app/services/email_service.py (verification / reset / alerts).
      - key: MAIL_USERNAME
        value: "cybershield786@gmail.com"
      - key: MAIL_PASSWORD
        value: "vjkdjrftairxjljt"
      - key: MAIL_FROM
        value: "cybershield786@gmail.com"
      - key: MAIL_PORT
        value: "465"
      - key: MAIL_SERVER
        value: "smtp.gmail.com"
      - key: MAIL_STARTTLS
        value: "False"
      - key: MAIL_SSL_TLS
        value: "True"
      - key: USE_CREDENTIALS
        value: "True"
      - key: VALIDATE_CERTS
        value: "True"
      # Fallback credentials used by the smtplib sender (send_security_alert etc.)
      - key: EMAIL_USER
        value: "cybershield786@gmail.com"
      - key: EMAIL_PASSWORD
        value: "vjkdjrftairxjljt"
      # Resend API email delivery (HTTPS) — works on Render where Gmail SMTP is blocked.
      - key: RESEND_API_KEY
        value: "re_EHu3pbz7_BH4oTZRqHSJE9P8Ae9zCAFuX"
      - key: RESEND_FROM
        value: "CyberShield <onboarding@resend.dev>"
    autoDeploy: true